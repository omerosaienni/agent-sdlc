# Gate: tests/run.sh on every PR into main. Red tests block merge.
name: tests

on:
  pull_request:
    branches: [main]

jobs:
  # Two Go versions, because the Go runners classify go's OWN output and that output
  # is not stable across releases: Go 1.26 dropped the "# import/path" banner from
  # go vet, which silently turned every vet finding into an environment block on a
  # current toolchain while still passing on an older one. A single version cannot
  # catch that class, and a developer machine is always a single version.
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    # The setup gate the live proofs drive requires an AUTHENTICATED gh, and the
    # runner ships the binary with no credentials. Without this the Go proofs
    # skipped themselves on an honest tooling gate, so the one suite that exercises
    # the whole path end to end never ran where it matters most. The automatic token
    # is enough: the proofs scaffold LOCAL scratch projects and never create a remote
    # (no origin is a note, not a failure), so nothing is pushed anywhere.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # The generator suites scaffold a real project and let it make its initial
      # commit; the generator requires a configured git identity (it never invents
      # an author). A fresh runner has none, so set one before the tests run.
      - name: Configure a git identity for the generator tests
        run: |
          git config --global user.name "agent-sdlc ci"
          git config --global user.email "ci@agent-sdlc.test"
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # No go.sum anywhere in this repo to key a cache on; the scaffolded
          # fixtures are throwaway. Silences a restore-cache warning per run.
          cache: false
      - name: Run test suites
        run: ./tests/run.sh

  # The single check branch protection requires. A matrix publishes one context per
  # leg ("suites (stable)", ...), so protection pinned to a fixed name would wait
  # forever on a context that no longer exists. This job keeps "test" reported while
  # letting the matrix grow, and it must FAIL when any leg does: `needs` alone would
  # skip it, and a skipped required check reads as unfulfilled, not as failure.
  test:
    runs-on: ubuntu-latest
    needs: suites
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "suites: ${{ needs.suites.result }}"
          [ "${{ needs.suites.result }}" = "success" ]
