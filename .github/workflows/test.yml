# Gate: tests/run.sh on every PR into main. Red tests block merge. Only dep is node
# (the scripts under test embed it), preinstalled on the runner.
name: tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The setup gate the live proofs drive requires an AUTHENTICATED gh, and the
    # runner ships the binary with no credentials. Without this the Go proofs
    # skipped themselves on an honest tooling gate, so the one suite that exercises
    # the whole path end to end never ran where it matters most. The automatic
    # token is enough: the proofs scaffold LOCAL scratch projects and never create a
    # remote (no origin is a note, not a failure), so nothing is pushed anywhere.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # The generator suites scaffold a real project and let it make its initial
      # commit; the generator requires a configured git identity (it never invents
      # an author). A fresh runner has none, so set one before the tests run.
      - name: Configure a git identity for the generator tests
        run: |
          git config --global user.name "agent-sdlc ci"
          git config --global user.email "ci@agent-sdlc.test"
      # Go is not preinstalled at a pinned version, and the Go suites are the ones
      # this branch adds. Without it they skip, which is exactly the hole that let a
      # red branch look green.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run test suites
        run: ./tests/run.sh
