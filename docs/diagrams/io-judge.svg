<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 210" role="img" font-family="sans-serif">
<title>Inputs and outputs: Judge</title>
<desc>Judge. Inputs: the code (approved by the reviewer); acceptance criteria (from the sheet); the test suite, which it runs itself. Outputs: verdict: pass or reject; judge report (per-tier coverage); environment block (if endpoint down).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="60" y="42" dominant-baseline="central" fill="#085041" font-size="16" font-weight="500">Judge</text>
<text x="60" y="92" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Inputs</text>
<text x="60" y="116" dominant-baseline="central" fill="#5F5E5A" font-size="12">the code (approved by the reviewer)</text>
<text x="60" y="136" dominant-baseline="central" fill="#5F5E5A" font-size="12">acceptance criteria (from the sheet)</text>
<text x="60" y="156" dominant-baseline="central" fill="#5F5E5A" font-size="12">the test suite, which it runs itself</text>
<line x1="330" y1="120" x2="390" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="410" y="92" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Outputs</text>
<text x="410" y="116" dominant-baseline="central" fill="#5F5E5A" font-size="12">verdict: pass or reject</text>
<text x="410" y="136" dominant-baseline="central" fill="#5F5E5A" font-size="12">judge report (per-tier coverage)</text>
<text x="410" y="156" dominant-baseline="central" fill="#5F5E5A" font-size="12">environment block (if endpoint down)</text>
</svg>
