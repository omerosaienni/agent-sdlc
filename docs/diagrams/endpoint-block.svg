<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 360" role="img" font-family="sans-serif">
<title>Endpoint block sequence: how the judge handles a downed integration endpoint</title>
<desc>Before running the integration tier the judge checks endpoint readiness. If the endpoint is down it raises an environment block, telling you in the session, naming the endpoint and the bring-up command, spending no judge attempt. You bring it up and confirm, then the judge re-checks and continues.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="190" y="24" width="300" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">Judge checks endpoint readiness</text>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">before running the integration tier</text>
<line x1="340" y1="74" x2="340" y2="104" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="90" text-anchor="start" fill="#73726c" font-size="12">down</text>
<rect x="150" y="104" width="380" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" dominant-baseline="central" fill="#633806" font-size="14" font-weight="500">Environment block: tells you in the session</text>
<text x="340" y="143" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">names the endpoint (Mongo) and the bring-up command</text>
<text x="340" y="159" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">no verdict, no judge attempt spent</text>
<line x1="340" y1="168" x2="340" y2="198" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="190" y="198" width="300" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="216" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500">You bring it up, then confirm</text>
<text x="340" y="234" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">make up</text>
<line x1="340" y1="248" x2="340" y2="278" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="190" y="278" width="300" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="296" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">Judge re-checks and continues</text>
<text x="340" y="314" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">runs the integration tier</text>
</svg>
