<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 648" role="img" font-family="sans-serif">
<title>Per-increment build loop: orchestrator spawns subagents and does the git work</title>
<desc>The orchestrator is your build-loop session. It spawns the builder, reviewer, judge, and document agent as subagents with fresh context, sequences them, owns state.json, and commits and opens the PR itself. The reviewer bounces and the judge rejects up to three times. The human merges the PR as the final gate.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="36" y="20" width="172" height="600" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" opacity="0.6"/>
<text x="122" y="42" text-anchor="middle" fill="#444441" font-size="13" font-weight="500">Orchestrator</text>
<text x="122" y="59" text-anchor="middle" fill="#5F5E5A" font-size="10">your /omero-build-loop</text>
<text x="122" y="72" text-anchor="middle" fill="#5F5E5A" font-size="10">session, the conductor</text>
<text x="122" y="132" text-anchor="middle" fill="#5F5E5A" font-size="10">spawns each</text>
<text x="122" y="145" text-anchor="middle" fill="#5F5E5A" font-size="10">subagent &#8594;</text>
<text x="122" y="300" text-anchor="middle" fill="#5F5E5A" font-size="10">sequences them,</text>
<text x="122" y="313" text-anchor="middle" fill="#5F5E5A" font-size="10">owns state.json</text>
<text x="122" y="486" text-anchor="middle" fill="#5F5E5A" font-size="10" font-weight="500">commits +</text>
<text x="122" y="499" text-anchor="middle" fill="#5F5E5A" font-size="10" font-weight="500">opens the PR</text>
<text x="360" y="100" text-anchor="middle" fill="#5F5E5A" font-size="10" font-style="italic">subagents the orchestrator spawns (fresh context each)</text>
<rect x="265" y="110" width="190" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="360" y="132" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">Builder</text>
<line x1="360" y1="154" x2="360" y2="186" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="265" y="186" width="190" height="44" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="360" y="208" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">Reviewer</text>
<line x1="360" y1="230" x2="360" y2="266" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="372" y="250" fill="#73726c" font-size="12">approved</text>
<rect x="265" y="266" width="190" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="360" y="285" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">Judge</text><text x="360" y="303" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">unit then integration</text>
<line x1="360" y1="322" x2="360" y2="358" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="372" y="342" fill="#73726c" font-size="12">passed</text>
<rect x="265" y="358" width="190" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="360" y="377" text-anchor="middle" dominant-baseline="central" fill="#633806" font-size="14" font-weight="500">Document</text><text x="360" y="395" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">producer, never blocks</text>
<line x1="208" y1="132" x2="261" y2="132" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="208" y1="208" x2="261" y2="208" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="208" y1="294" x2="261" y2="294" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="208" y1="386" x2="261" y2="386" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="360" y1="414" x2="360" y2="458" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="372" y="438" fill="#73726c" font-size="12">docs written</text>
<rect x="265" y="458" width="190" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="360" y="480" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500">Open PR into main</text>
<line x1="208" y1="480" x2="263" y2="480" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="360" y1="502" x2="360" y2="538" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="265" y="538" width="190" height="44" rx="10" fill="none" stroke="#444441" stroke-width="1.2"/><text x="360" y="556" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500">Human merges the PR</text><text x="360" y="572" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="11">you, the final gate</text>
<line x1="360" y1="582" x2="360" y2="602" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="616" text-anchor="middle" fill="#73726c" font-size="12">advance to next increment</text>
<path d="M455 200 C500 200, 500 124, 455 124" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/><text x="512" y="162" text-anchor="middle" fill="#534AB7" font-size="12">bounce &#8804;3</text>
<path d="M455 290 C540 290, 540 140, 455 140" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/><text x="556" y="215" text-anchor="middle" fill="#0F6E56" font-size="12">reject &#8804;3</text>
</svg>
