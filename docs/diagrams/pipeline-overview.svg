<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 470" role="img" font-family="sans-serif">
<title>Pipeline: design and setup are parallel prerequisites that converge at build, then complete</title>
<desc>Design converges on a feature sheet per feature, plus one epic manifest recording the features in build order (the human's build order reference, not a build input). Setup proves the environment and writes a receipt. Both are independent prerequisites. The build loop needs the sheet and receipt, runs once per increment, and a final pull request to main completes the feature queue.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- design branch (top) -->
<rect x="40" y="44" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="150" y="65" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">Design partner</text>
<text x="150" y="83" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">converges on the sheet</text>
<line x1="260" y1="72" x2="300" y2="72" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="44" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="375" y="65" text-anchor="middle" dominant-baseline="central" fill="#633806" font-size="13" font-weight="500">Feature sheet</text>
<text x="375" y="83" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">typed seam</text>

<!-- setup branch (bottom) -->
<rect x="40" y="150" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="171" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">Setup gate</text>
<text x="150" y="189" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">proves the environment</text>
<line x1="260" y1="178" x2="300" y2="178" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="150" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="375" y="171" text-anchor="middle" dominant-baseline="central" fill="#633806" font-size="13" font-weight="500">Receipt</text>
<text x="375" y="189" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">setup-ok</text>

<!-- label for parallel prerequisites -->
<text x="150" y="128" text-anchor="middle" fill="#73726c" font-size="11" font-style="italic">independent, either order</text>

<!-- converge into build -->
<path d="M450 72 C500 72, 500 111, 540 111" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M450 178 C500 178, 500 139, 540 139" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540" y="97" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="595" y="118" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">Build loop</text>
<text x="595" y="136" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="11">per increment</text>

<!-- build needs both label -->
<text x="500" y="95" text-anchor="middle" fill="#73726c" font-size="11">needs both</text>

<!-- build repeats -->
<path d="M650 113 C672 113, 672 137, 650 137" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

<!-- build down to complete -->
<line x1="595" y1="153" x2="595" y2="200" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="490" y="200" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="565" y="221" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Queue complete</text>
<text x="565" y="239" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">final PR to main</text>

<!-- legend -->
<text x="40" y="300" font-size="12" fill="#444441" font-weight="500">The two gates are independent</text>
<text x="40" y="320" font-size="12" fill="#5F5E5A">Re-running design (new sheet) does not invalidate the setup receipt.</text>
<text x="40" y="338" font-size="12" fill="#5F5E5A">A tooling or environment change invalidates the receipt, not the sheet.</text>
<text x="40" y="356" font-size="12" fill="#5F5E5A">The build loop refuses to start without both the sheet and a valid receipt.</text>
<text x="40" y="380" font-size="12" fill="#5F5E5A">GitHub is optional: with no remote the build loop runs locally, committing each increment to local main instead of opening PRs.</text>
</svg>
