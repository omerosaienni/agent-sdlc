<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 352" role="img" font-family="sans-serif">
<title>Parallel-attended topology: independent sibling branches cut from one main, you combine</title>
<desc>In parallel-attended mode every dependency-eligible increment is cut fresh from the same origin/main, never stacked on a sibling. Each opens a PR back into main which the human merges in their own order, resolving any append conflicts. Each branch is green only in isolation against the main it was cut from; after combining the human re-runs the suite, because green is per-branch not per-main.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" fill="#444441" font-size="13" font-weight="500">parallel-attended: independent siblings, each cut fresh from the same origin/main, never stacked</text>

<!-- main line -->
<text x="40" y="254" fill="#5F5E5A" font-size="12" font-weight="500">main</text>
<line x1="90" y1="250" x2="640" y2="250" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="120" cy="250" r="5" fill="#5F5E5A"/>
<circle cx="330" cy="250" r="5" fill="#5F5E5A"/><circle cx="440" cy="250" r="5" fill="#5F5E5A"/><circle cx="540" cy="250" r="5" fill="#5F5E5A"/>

<!-- the single cut point: a vertical guide showing all siblings cut here -->
<line x1="185" y1="250" x2="185" y2="78" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<circle cx="185" cy="250" r="5" fill="#5F5E5A"/>
<text x="150" y="272" fill="#5F5E5A" font-size="10">all cut here</text>
<text x="118" y="285" fill="#5F5E5A" font-size="10">(current origin/main)</text>

<!-- sibling A -->
<circle cx="185" cy="92" r="4" fill="#185FA5"/>
<line x1="185" y1="92" x2="300" y2="92" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="300" cy="92" r="4" fill="#185FA5"/>
<path d="M300 92 C318 140, 322 200, 330 244" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="86" fill="#185FA5" font-size="10">feat/gridfs-store</text>

<!-- sibling B -->
<circle cx="185" cy="132" r="4" fill="#185FA5"/>
<line x1="185" y1="132" x2="360" y2="132" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="360" cy="132" r="4" fill="#185FA5"/>
<path d="M360 132 C400 170, 420 210, 440 244" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="126" fill="#185FA5" font-size="10">feat/oplog-peek</text>

<!-- sibling C -->
<circle cx="185" cy="172" r="4" fill="#185FA5"/>
<line x1="185" y1="172" x2="430" y2="172" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="430" cy="172" r="4" fill="#185FA5"/>
<path d="M430 172 C480 200, 510 225, 540 244" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="192" y="166" fill="#185FA5" font-size="10">feat/rbac-roles</text>

<!-- more siblings -->
<circle cx="185" cy="210" r="4" fill="#185FA5"/>
<line x1="185" y1="210" x2="300" y2="210" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="192" y="204" fill="#185FA5" font-size="10">feat/sse-server ...</text>

<!-- PR labels -->
<text x="322" y="160" fill="#444441" font-size="9">PR</text>
<text x="432" y="186" fill="#444441" font-size="9">PR</text>
<text x="542" y="206" fill="#444441" font-size="9">PR</text>

<!-- caption -->
<text x="40" y="305" fill="#5F5E5A" font-size="11">Each is built and verified against main as it stood at its own cut, in isolation. You merge the siblings in any order and</text>
<text x="40" y="321" fill="#5F5E5A" font-size="11">resolve conflicts. Green is per-branch, not per-main: after combining, re-run the suite. The loop never merges or stacks.</text>
<text x="40" y="343" fill="#5F5E5A" font-size="11">With no GitHub remote the modes coincide: there are no open PRs, so the loop integrates each increment into local main as it lands.</text>
</svg>
