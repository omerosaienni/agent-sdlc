<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 210" role="img" font-family="sans-serif">
<title>Inputs and outputs: Document</title>
<desc>Document. Inputs: the doc-payload slice (from the builder); the approved reviewer report; the judge report. Outputs: docs/modules/&lt;id&gt;-&lt;module&gt;.md; the docs/ARCHITECTURE.md section; no verdict (it never blocks).</desc>
