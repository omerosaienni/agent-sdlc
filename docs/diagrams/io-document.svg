<text x="60" y="156" dominant-baseline="central" fill="#5F5E5A" font-size="12">the judge report</text>
<line x1="330" y1="120" x2="390" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="410" y="92" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Outputs</text>
<text x="410" y="116" dominant-baseline="central" fill="#5F5E5A" font-size="12">docs/modules/&lt;id&gt;-&lt;module&gt;.md</text>
