<rect x="40" y="20" width="600" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="60" y="42" dominant-baseline="central" fill="#633806" font-size="16" font-weight="500">Document</text>
<text x="60" y="92" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Inputs</text>
<text x="60" y="116" dominant-baseline="central" fill="#5F5E5A" font-size="12">the doc-payload slice (from the builder)</text>
