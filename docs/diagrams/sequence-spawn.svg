<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 560" role="img" font-family="sans-serif">
<title>Sequence: orchestrator spawns each subagent over time</title>
<desc>The orchestrator spawns the builder, reviewer, judge, and document subagents in turn, each does its work on its lifeline and ends, writing a file the orchestrator reads. The orchestrator commits, opens the PR, and writes state itself. The human merges.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="120" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="100" y="39" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">Orchestrator</text>
<line x1="100" y1="58" x2="100" y2="540" stroke="#5F5E5A" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="190" y="20" width="90" height="38" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="235" y="39" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">Builder</text>
<line x1="235" y1="58" x2="235" y2="540" stroke="#185FA5" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="310" y="20" width="90" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="355" y="39" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">Reviewer</text>
<line x1="355" y1="58" x2="355" y2="540" stroke="#534AB7" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="430" y="20" width="90" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="475" y="39" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">Judge</text>
<line x1="475" y1="58" x2="475" y2="540" stroke="#0F6E56" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="540" y="20" width="100" height="38" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="590" y="39" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">Document</text>
<line x1="590" y1="58" x2="590" y2="540" stroke="#854F0B" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="100" y1="84" x2="233" y2="84" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="110" y="78" fill="#5F5E5A" font-size="10">spawn (increment spec)</text>
<rect x="229" y="84" width="12" height="40" fill="#185FA5" opacity="0.25"/>
<line x1="235" y1="124" x2="102" y2="124" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="3 2"/><text x="110" y="118" fill="#5F5E5A" font-size="10">writes code + builder.md, ends</text>
<line x1="100" y1="150" x2="353" y2="150" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="110" y="144" fill="#5F5E5A" font-size="10">spawn (code, conventions)</text>
<rect x="349" y="150" width="12" height="36" fill="#534AB7" opacity="0.25"/>
<line x1="355" y1="186" x2="102" y2="186" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="3 2"/><text x="110" y="180" fill="#5F5E5A" font-size="10">report; bounce or approve, ends</text>
<rect x="150" y="198" width="240" height="20" rx="4" fill="none" stroke="#534AB7" stroke-width="0.5" opacity="0.6"/><text x="270" y="208" text-anchor="middle" fill="#534AB7" font-size="10">on bounce: respawn builder, then reviewer (max 3)</text>
<line x1="100" y1="240" x2="473" y2="240" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="110" y="234" fill="#5F5E5A" font-size="10">spawn (code, criteria) fresh context</text>
<rect x="469" y="240" width="12" height="40" fill="#0F6E56" opacity="0.25"/>
<line x1="475" y1="280" x2="102" y2="280" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="3 2"/><text x="110" y="274" fill="#5F5E5A" font-size="10">runs tests itself; verdict, ends</text>
<rect x="150" y="292" width="260" height="20" rx="4" fill="none" stroke="#0F6E56" stroke-width="0.5" opacity="0.6"/><text x="280" y="302" text-anchor="middle" fill="#0F6E56" font-size="10">on reject: respawn builder, reviewer, judge (max 3)</text>
<line x1="100" y1="336" x2="588" y2="336" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="110" y="330" fill="#5F5E5A" font-size="10">spawn (payload + reports)</text>
<rect x="584" y="336" width="12" height="36" fill="#854F0B" opacity="0.25"/>
<line x1="590" y1="372" x2="102" y2="372" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="3 2"/><text x="110" y="366" fill="#5F5E5A" font-size="10">writes docs (never blocks), ends</text>
<rect x="94" y="392" width="12" height="56" fill="#5F5E5A" opacity="0.3"/>
<text x="116" y="404" fill="#5F5E5A" font-size="10">orchestrator itself:</text>
<text x="116" y="420" fill="#5F5E5A" font-size="10">commit code + docs only (reports stay local)</text>
<text x="116" y="436" fill="#5F5E5A" font-size="10">open PR, write state.json</text>
<rect x="40" y="466" width="120" height="34" rx="8" fill="none" stroke="#444441" stroke-width="1.1"/><text x="100" y="483" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">Human</text>
<line x1="160" y1="483" x2="100" y2="483" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="116" y="516" fill="#5F5E5A" font-size="10">human merges the PR, next increment</text>
</svg>
