<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 326" role="img" font-family="sans-serif">
<title>Role card: Judge</title>
<desc>Judge. Owns: type-check, acceptance criteria, tests pass, hollow-test. Produces: a pass report with per-tier coverage. Cannot: check conventions, style, or architecture. Context: fresh per review, runs the tests itself.</desc>
<rect x="40" y="30" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="51" dominant-baseline="central" fill="#085041" font-size="16" font-weight="500">Judge</text>
<text x="60" y="71" dominant-baseline="central" fill="#0F6E56" font-size="12">behaviour authority, fresh context</text>
<line x1="40" y1="142" x2="640" y2="142" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<line x1="40" y1="198" x2="640" y2="198" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<line x1="40" y1="254" x2="640" y2="254" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<text x="60" y="114" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Owns</text>
<text x="200" y="114" dominant-baseline="central" fill="#5F5E5A" font-size="12">type-check, acceptance criteria, tests pass, hollow-test</text>
<text x="60" y="170" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Produces</text>
<text x="200" y="170" dominant-baseline="central" fill="#5F5E5A" font-size="12">a pass report with per-tier coverage</text>
<text x="60" y="226" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Cannot</text>
<text x="200" y="226" dominant-baseline="central" fill="#5F5E5A" font-size="12">check conventions, style, or architecture</text>
<text x="60" y="282" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Context</text>
<text x="200" y="282" dominant-baseline="central" fill="#5F5E5A" font-size="12">fresh per review, runs the tests itself</text>
</svg>
