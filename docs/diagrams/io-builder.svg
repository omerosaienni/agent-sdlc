<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 210" role="img" font-family="sans-serif">
<title>Inputs and outputs: Builder</title>
<desc>Builder. Inputs: the increment spec (from the sheet); CLAUDE.md conventions; fix findings (on a bounce). Outputs: code; tests, named per convention; builder.md channel; the doc-payload.md slice for the document agent.</desc>
