<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 326" role="img" font-family="sans-serif">
<title>Role card: Reviewer</title>
<desc>Reviewer. Owns: conventions, architecture, scope, defects, tiers. Produces: a report each pass: a record, and a bounce. Cannot: bounce on opinion, or judge behaviour. Context: informed, reads the whole codebase.</desc>
<rect x="40" y="30" width="600" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="51" dominant-baseline="central" fill="#3C3489" font-size="16" font-weight="500">Reviewer</text>
<text x="60" y="71" dominant-baseline="central" fill="#534AB7" font-size="12">code authority, informed context</text>
<line x1="40" y1="142" x2="640" y2="142" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<line x1="40" y1="198" x2="640" y2="198" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<line x1="40" y1="254" x2="640" y2="254" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<text x="60" y="114" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Owns</text>
<text x="200" y="114" dominant-baseline="central" fill="#5F5E5A" font-size="12">conventions, architecture, scope, defects, tiers</text>
<text x="60" y="170" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Produces</text>
<text x="200" y="170" dominant-baseline="central" fill="#5F5E5A" font-size="12">a report each pass: a record, and a bounce</text>
<text x="60" y="226" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Cannot</text>
<text x="200" y="226" dominant-baseline="central" fill="#5F5E5A" font-size="12">bounce on opinion, or judge behaviour</text>
<text x="60" y="282" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Context</text>
<text x="200" y="282" dominant-baseline="central" fill="#5F5E5A" font-size="12">informed, reads the whole codebase</text>
</svg>
