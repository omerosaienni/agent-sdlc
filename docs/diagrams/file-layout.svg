<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 470" role="img" font-family="sans-serif">
<title>File layout: committed code and docs versus the gitignored .building folder</title>
<desc>The green box is what the commit and PR carry: code and docs. The grey box is the .building folder, all loop output, gitignored and never committed: build state, the agents' work files per unit, and a symlinked escalations index.</desc>
<text x="40" y="26" fill="#444441" font-size="14" font-weight="500">mongo-db-1/  on a deliverable's branch</text>
<rect x="40" y="42" width="270" height="150" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="58" y="64" fill="#27500A" font-size="14" font-weight="500">committed: the deliverable</text>
<text x="58" y="86" fill="#5F5E5A" font-size="12">src/db.ts, collections.ts, seed.ts</text>
<text x="58" y="106" fill="#5F5E5A" font-size="12">src/db.test.ts</text>
<text x="58" y="126" fill="#5F5E5A" font-size="12">src/seed.integration.test.ts</text>
<text x="58" y="148" fill="#5F5E5A" font-size="12">docs/modules/3-db.md</text>
<text x="58" y="168" fill="#5F5E5A" font-size="12">docs/ARCHITECTURE.md</text>
<rect x="330" y="42" width="310" height="330" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="348" y="64" fill="#444441" font-size="14" font-weight="500">.building/  local only, gitignored</text>
<text x="348" y="88" fill="#5F5E5A" font-size="12">build/</text>
<text x="364" y="106" fill="#5F5E5A" font-size="12">state.json</text>
<text x="364" y="124" fill="#5F5E5A" font-size="12">setup-ok</text>
<text x="348" y="148" fill="#5F5E5A" font-size="12">work/</text>
<text x="364" y="166" fill="#5F5E5A" font-size="12">d3-connection-helper/</text>
<text x="380" y="184" fill="#5F5E5A" font-size="12">builder.md</text>
<text x="380" y="202" fill="#5F5E5A" font-size="12">review-pass-1.md</text>
<text x="380" y="220" fill="#5F5E5A" font-size="12">judge.md</text>
<text x="380" y="238" fill="#5F5E5A" font-size="12">doc-payload.md</text>
<text x="364" y="258" fill="#5F5E5A" font-size="12">d4-crud/</text>
<text x="380" y="276" fill="#5F5E5A" font-size="12">review-pass-1..3.md</text>
<text x="380" y="294" fill="#5F5E5A" font-size="12">escalations/2026-06-21-1430.md</text>
<text x="348" y="318" fill="#5F5E5A" font-size="12">escalations/</text>
<text x="364" y="336" fill="#5F5E5A" font-size="12">2026-06-21-1430.md  -&gt;  work/d4-crud/...</text>
<text x="364" y="354" fill="#5F5E5A" font-size="12">(relative symlink, not a copy)</text>
<text x="40" y="404" fill="#5F5E5A" font-size="12">Green = what lands in the PR and on main: code and docs only.</text>
<text x="40" y="424" fill="#5F5E5A" font-size="12">Grey = everything the loop generates, one gitignored folder, never committed.</text>
<text x="40" y="448" fill="#444441" font-size="14" font-weight="500">.gitignore:  .building/</text>
</svg>
