<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 330" role="img" font-family="sans-serif">
<title>Roles comparison: orchestrator, builder, reviewer, judge by what they own, their context, and whether they can block</title>
<desc>The orchestrator owns the sequence and state, is passive, cannot block. The builder owns the deliverable, is building, cannot block. The reviewer owns the code, is informed, can bounce up to three times. The judge owns the behaviour, is fresh, can reject up to three times. The reviewer and judge split on two axes, code versus behaviour and informed versus fresh, which is why neither is redundant.</desc>
<text x="60" y="128" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">owns</text>
<text x="60" y="190" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">context</text>
<text x="60" y="232" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">can block?</text>

<rect x="150" y="100" width="115" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="207" y="122" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500">Orchestrator</text>
<text x="207" y="140" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="11">sequence + state</text>
<rect x="278" y="100" width="115" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="335" y="122" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">Builder</text>
<text x="335" y="140" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="11">the deliverable</text>
<rect x="406" y="100" width="115" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="463" y="122" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">Reviewer</text>
<text x="463" y="140" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="11">the code</text>
<rect x="534" y="100" width="115" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="591" y="122" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">Judge</text>
<text x="591" y="140" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="11">the behaviour</text>

<line x1="40" y1="170" x2="649" y2="170" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<text x="207" y="190" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">passive</text>
<text x="335" y="190" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">building</text>
<text x="463" y="190" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">informed</text>
<text x="591" y="190" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">fresh</text>

<line x1="40" y1="212" x2="649" y2="212" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<text x="207" y="232" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">no</text>
<text x="335" y="232" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">no</text>
<text x="463" y="232" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="12">bounce, up to 3</text>
<text x="591" y="232" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="12">reject, up to 3</text>

<line x1="40" y1="254" x2="649" y2="254" stroke="#5F5E5A" stroke-width="0.3" opacity="0.4"/>
<text x="40" y="282" dominant-baseline="central" fill="#5F5E5A" font-size="12">The reviewer and judge split on two axes: code versus behaviour, and informed versus fresh.</text>
<text x="40" y="300" dominant-baseline="central" fill="#5F5E5A" font-size="12">That split is why neither is redundant, and why no code reaches the judge without a review first.</text>
</svg>
