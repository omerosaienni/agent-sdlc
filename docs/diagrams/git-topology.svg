<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 300" role="img" font-family="sans-serif">
<title>Sequential-attended topology: one branch per deliverable, cut from origin/main, PR back to main</title>
<desc>Each deliverable cuts a meaningfully named branch from a freshly-fetched origin/main, does the work, and opens a PR back into main which the human reviews and merges. The next deliverable cuts fresh from origin/main. There is no integration branch. main is always green and each PR is one deliverable's audit record.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" fill="#444441" font-size="13" font-weight="500">sequential-attended: one branch per deliverable, cut from origin/main, PR back to main</text>
<text x="40" y="130" fill="#5F5E5A" font-size="12" font-weight="500">main</text>
<line x1="90" y1="126" x2="640" y2="126" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="120" cy="126" r="5" fill="#5F5E5A"/><circle cx="300" cy="126" r="5" fill="#5F5E5A"/><circle cx="480" cy="126" r="5" fill="#5F5E5A"/><circle cx="610" cy="126" r="5" fill="#5F5E5A"/>
<path d="M120 126 C140 90, 150 70, 170 56" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<line x1="170" y1="56" x2="250" y2="56" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="170" cy="56" r="4" fill="#185FA5"/><circle cx="250" cy="56" r="4" fill="#185FA5"/>
<path d="M250 56 C275 75, 285 100, 300 122" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="44" fill="#185FA5" font-size="10">d3-connection-helper</text>
<text x="278" y="92" fill="#444441" font-size="9">PR</text>
<path d="M300 126 C320 90, 330 70, 350 56" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<line x1="350" y1="56" x2="430" y2="56" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="350" cy="56" r="4" fill="#185FA5"/><circle cx="430" cy="56" r="4" fill="#185FA5"/>
<path d="M430 56 C455 75, 465 100, 480 122" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="44" fill="#185FA5" font-size="10">d04-crud</text>
<path d="M480 126 C500 90, 510 70, 530 56" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="530" y1="56" x2="590" y2="56" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="530" cy="56" r="4" fill="#185FA5"/>
<text x="525" y="44" fill="#185FA5" font-size="10">d05-indexes ...</text>
<text x="40" y="200" fill="#5F5E5A" font-size="11">Each deliverable: cut a branch from a freshly-fetched origin/main, named after the work (audit trail), build,</text>
<text x="40" y="218" fill="#5F5E5A" font-size="11">review, judge, document, open a PR into main. You review and merge it. The next deliverable cuts fresh from</text>
<text x="40" y="236" fill="#5F5E5A" font-size="11">origin/main only after the previous PR merged, so it starts from all merged work and main is always green.</text>
</svg>
