<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 430" role="img" font-family="sans-serif">
<title>Error path map</title>
<desc>Reviewer bounce and judge reject respawn from the builder with a budget of three then escalate. Hollow suite is a hard fail counting as a reject. Endpoint down pauses without spending an attempt. Missing doc slice degrades and never blocks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" fill="#444441" font-size="13" font-weight="500">What can interrupt a deliverable, and what happens</text>
<rect x="40" y="50" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="120" y="65" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">Reviewer bounce</text><text x="120" y="81" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="10">critical/major, evidence</text>
<line x1="200" y1="72" x2="250" y2="72" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="250" y="50" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="330" y="72" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">respawn builder, retry</text>
<text x="430" y="72" font-size="11" dominant-baseline="central" fill="#5F5E5A">budget 3, then</text>
<rect x="540" y="50" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="590" y="72" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">escalate</text>
<rect x="40" y="114" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="120" y="129" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">Judge reject</text><text x="120" y="145" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="10">type / test / criteria fail</text>
<line x1="200" y1="136" x2="250" y2="136" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="250" y="114" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="330" y="136" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">respawn from builder</text>
<text x="430" y="136" font-size="11" dominant-baseline="central" fill="#5F5E5A">budget 3, then</text>
<rect x="540" y="114" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="590" y="136" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">escalate</text>
<rect x="40" y="178" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="120" y="193" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">Setup/endpoint not ready</text><text x="120" y="209" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="10">environment, not a deliverable error</text>
<line x1="200" y1="200" x2="250" y2="200" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="250" y="178" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="350" y="193" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">pause, tell you, no attempt spent</text><text x="350" y="209" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="10">resume on confirm</text>
<text x="525" y="200" font-size="11" dominant-baseline="central" fill="#5F5E5A">not a failure</text>
<rect x="40" y="242" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="120" y="257" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">Hollow suite</text><text x="120" y="273" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="10">tier selects zero tests</text>
<line x1="200" y1="264" x2="250" y2="264" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="250" y="242" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="350" y="264" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">hard fail (judge), counts as reject</text>
<rect x="40" y="306" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="120" y="321" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">Missing doc slice</text><text x="120" y="337" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="10">builder skipped it</text>
<line x1="200" y1="328" x2="250" y2="328" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="250" y="306" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="350" y="321" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">document degrades, marks gap</text><text x="350" y="337" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="10">reviewer notes it, never blocks</text>
<text x="40" y="392" fill="#5F5E5A" font-size="11">Two kinds of interruption: those that cost an attempt and can escalate (bounce, reject, hollow suite),</text>
<text x="40" y="410" fill="#5F5E5A" font-size="11">and those that never fail verified work (endpoint pause, missing docs). The line between them is the design.</text>
</svg>
