<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 210" role="img" font-family="sans-serif">
<title>Inputs and outputs: Reviewer</title>
<desc>Reviewer. Inputs: the code (full deliverable, or the delta); CLAUDE.md conventions; builder.md channel. Outputs: review report (record, for you); bounce with evidence (to builder); approve or escalate.</desc>
