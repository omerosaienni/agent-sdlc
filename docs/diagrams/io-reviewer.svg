<rect x="40" y="20" width="600" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="60" y="42" dominant-baseline="central" fill="#3C3489" font-size="16" font-weight="500">Reviewer</text>
<text x="60" y="92" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Inputs</text>
<text x="60" y="116" dominant-baseline="central" fill="#5F5E5A" font-size="12">the code (full deliverable, or the delta)</text>
<text x="60" y="136" dominant-baseline="central" fill="#5F5E5A" font-size="12">CLAUDE.md conventions</text>
<text x="60" y="156" dominant-baseline="central" fill="#5F5E5A" font-size="12">builder.md channel</text>
<line x1="320" y1="120" x2="380" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#a)"/>
<text x="400" y="92" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500">Outputs</text>
<text x="400" y="116" dominant-baseline="central" fill="#5F5E5A" font-size="12">review report (record, for you)</text>
<text x="400" y="136" dominant-baseline="central" fill="#5F5E5A" font-size="12">bounce with evidence (to builder)</text>
<text x="400" y="156" dominant-baseline="central" fill="#5F5E5A" font-size="12">approve or escalate</text>
</svg>
