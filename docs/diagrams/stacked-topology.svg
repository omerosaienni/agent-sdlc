<svg xmlns="http://www.w3.org/2000/svg" width="720" viewBox="0 0 720 360" role="img" font-family="sans-serif">
<title>Unattended stacked topology: one linear git-town stack, each increment stacked on the previous, features chained by tag, the loop proposes PRs but never merges</title>
<desc>The loop builds increments incrementally as one linear git-town stack: each increment is a branch appended onto the previous one (its parent), and one stacked PR is opened per increment with its base set to that parent, not main. A feature's first increment is stacked on the previous feature's stack tip, found by the feature/&lt;name&gt; tag. Tags are the index: feature/&lt;name&gt; marks each feature tip and epic/&lt;name&gt; the overall tip, force-moved to stay current. The loop never merges to main and never ships; a human merges the stack bottom-up at their own pace while the queue keeps building.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" fill="#444441" font-size="13" font-weight="500">unattended stacked: one linear git-town stack, each increment stacked on the previous, features chained by tag</text>

<text x="30" y="298" fill="#5F5E5A" font-size="12" font-weight="500">main</text>
<line x1="70" y1="294" x2="670" y2="294" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="120" cy="294" r="5" fill="#5F5E5A"/>

<!-- the staircase: each node stacked on the one before it (parent), branch colour -->
<!-- branch off main to the first increment -->
<path d="M120 294 C130 270, 140 258, 150 246" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<!-- the stack lineage, node to node (parent links) -->
<line x1="150" y1="246" x2="270" y2="206" stroke="#185FA5" stroke-width="1.5"/>
<line x1="270" y1="206" x2="390" y2="166" stroke="#185FA5" stroke-width="1.5"/>
<line x1="390" y1="166" x2="510" y2="126" stroke="#185FA5" stroke-width="1.5"/>
<path d="M510 126 L600 96" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>

<circle cx="150" cy="246" r="4" fill="#185FA5"/>
<circle cx="270" cy="206" r="4" fill="#185FA5"/>
<circle cx="390" cy="166" r="4" fill="#185FA5"/>
<circle cx="510" cy="126" r="4" fill="#185FA5"/>

<text x="118" y="238" fill="#185FA5" font-size="10">feat/a_01</text>
<text x="238" y="198" fill="#185FA5" font-size="10">feat/a_02</text>
<text x="360" y="158" fill="#185FA5" font-size="10">feat/b_01</text>
<text x="480" y="118" fill="#185FA5" font-size="10">feat/b_02 ...</text>

<!-- per-segment stacked PRs: base is the parent branch, not main -->
<text x="196" y="234" fill="#444441" font-size="9">PR base:a_01</text>
<text x="316" y="194" fill="#444441" font-size="9">PR base:a_02</text>
<text x="436" y="154" fill="#444441" font-size="9">PR base:b_01</text>

<!-- tags are the index: feature tips and the epic tip, force-moved -->
<rect x="243" y="216" width="86" height="15" rx="2" fill="#dceadf" stroke="#5a8a66"/>
<text x="249" y="227" fill="#3f6a4a" font-size="9">tag feature/a</text>
<rect x="470" y="136" width="86" height="15" rx="2" fill="#dceadf" stroke="#5a8a66"/>
<text x="476" y="147" fill="#3f6a4a" font-size="9">tag feature/b</text>
<rect x="470" y="153" width="86" height="15" rx="2" fill="#dceadf" stroke="#5a8a66"/>
<text x="476" y="164" fill="#3f6a4a" font-size="9">tag epic/e</text>

<!-- feature B stacks on feature A's tip via its tag -->
<path d="M300 214 C330 208, 345 200, 360 176" fill="none" stroke="#5a8a66" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="300" y="250" fill="#3f6a4a" font-size="9">feature B's first increment stacks on feature/a</text>

<!-- concurrent human merge of the stack bottom, the loop never does this -->
<path d="M150 246 C135 262, 128 276, 120 292" fill="none" stroke="#b8743d" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="60" y="326" fill="#b8743d" font-size="10">Human ships the stack bottom-up at their own pace (git town ship), while the loop keeps building. The loop never merges.</text>

<text x="40" y="346" fill="#5F5E5A" font-size="11">Each increment: append a branch onto the current tip, build, review, judge (both tiers + docs in full, unit only in quick), open one stacked PR (base = parent). No checkpoint; runs to sheet exhaustion, then force-moves the tags. An escalation halts the chain.</text>
</svg>
