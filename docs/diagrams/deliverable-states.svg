<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 440" role="img" font-family="sans-serif">
<title>Deliverable state machine</title>
<desc>A deliverable moves pending, building, in review, in judgement, documented, PR open, merged. Bounce and reject loop back to building. Escalated and blocked are interruption states.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="28" fill="#444441" font-size="13" font-weight="500">A deliverable's life in state.json</text>
<rect x="40" y="50" width="110" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="95" y="70" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">pending</text>
<line x1="150" y1="70" x2="200" y2="70" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="200" y="50" width="110" height="40" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="255" y="70" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12">building</text>
<line x1="310" y1="70" x2="360" y2="70" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="360" y="50" width="110" height="40" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="415" y="70" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">in review</text>
<line x1="470" y1="70" x2="520" y2="70" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="520" y="50" width="120" height="40" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="580" y="70" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">in judgement</text>
<path d="M360 82 C320 110, 290 110, 258 92" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/><text x="305" y="116" text-anchor="middle" font-size="10" fill="#534AB7">bounce, building</text>
<path d="M540 90 C470 150, 300 150, 256 92" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/><text x="400" y="150" text-anchor="middle" font-size="10" fill="#0F6E56">reject, building</text>
<line x1="580" y1="90" x2="580" y2="184" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="592" y="140" font-size="10" fill="#5F5E5A">passed</text>
<rect x="520" y="184" width="120" height="40" rx="20" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="580" y="204" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">documented</text>
<line x1="520" y1="204" x2="470" y2="204" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="360" y="184" width="110" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="415" y="204" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">PR open</text>
<line x1="360" y1="204" x2="310" y2="204" stroke="#73726c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="335" y="198" text-anchor="middle" font-size="10" fill="#5F5E5A">merge</text>
<rect x="200" y="184" width="110" height="40" rx="20" fill="none" stroke="#444441" stroke-width="1.1"/><text x="255" y="204" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">merged</text>
<rect x="40" y="300" width="150" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="115" y="320" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">escalated (3 fails)</text>
<rect x="210" y="300" width="170" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="295" y="320" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">blocked (endpoint down)</text>
<path d="M255 90 C160 200, 130 250, 115 298" fill="none" stroke="#854F0B" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M560 90 C540 250, 400 270, 360 300" fill="none" stroke="#854F0B" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="40" y="380" fill="#5F5E5A" font-size="11">Solid = happy path. Coloured loops back to building = bounce or reject (each max 3).</text>
<text x="40" y="398" fill="#5F5E5A" font-size="11">Dashed amber = interruptions. Dashed purple = escalation recovery: you fix on the branch, it re-enters review.</text>
<text x="40" y="416" fill="#5F5E5A" font-size="11">merged is the only success terminal; the orchestrator records each transition in state.json (the canonical enum).</text>
<path d="M40 320 C12 320, 12 92, 360 92" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="20" y="270" fill="#534AB7" font-size="10" transform="rotate(-90 20 270)">you fix, continue: re-enters review</text>
</svg>
