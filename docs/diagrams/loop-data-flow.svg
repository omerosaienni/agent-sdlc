<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 584" role="img" font-family="sans-serif">
<title>Loop data flow with file shapes</title>
<desc>Shared inputs available to all agents; builder produces code and a channel file; reviewer produces a report file; judge runs tests and produces a report file; on pass reports, docs, and a PR. On-disk artifacts are drawn as files.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M180 20 L456 20 L480 44 L480 68 L180 68 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><path d="M456 20 L456 44 L480 44" fill="none" stroke="#854F0B" stroke-width="0.5"/>
<text x="330" y="38" text-anchor="middle" dominant-baseline="central" fill="#633806" font-size="14" font-weight="500">Deliverable sheet + CLAUDE.md</text><text x="330" y="55" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">available to all agents</text>
<line x1="340" y1="68" x2="340" y2="96" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="96" width="200" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="340" y="118" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500">Builder</text>
<line x1="340" y1="140" x2="340" y2="168" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="352" y="154" fill="#73726c" font-size="12">produces</text>
<path d="M190 168 L466 168 L490 192 L490 208 L190 208 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><path d="M466 168 L466 192 L490 192" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="335" y="188" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">code + tests + builder.md channel</text>
<line x1="340" y1="208" x2="340" y2="236" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="236" width="200" height="44" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="258" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">Reviewer</text>
<line x1="340" y1="280" x2="340" y2="308" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="352" y="294" fill="#73726c" font-size="12">produces</text>
<path d="M170 308 L486 308 L510 332 L510 348 L170 348 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><path d="M486 308 L486 332 L510 332" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="335" y="328" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">review report: record (you) + bounce (builder)</text>
<line x1="340" y1="348" x2="340" y2="376" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="376" width="200" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="395" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500">Judge</text><text x="340" y="413" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12">runs the test suite itself</text>
<line x1="340" y1="428" x2="340" y2="456" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="352" y="442" fill="#73726c" font-size="12">produces</text>
<path d="M170 456 L486 456 L510 480 L510 496 L170 496 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><path d="M486 456 L486 480 L510 480" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="335" y="476" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12">judge report: verdict + per-tier coverage</text>
<line x1="340" y1="496" x2="340" y2="524" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="352" y="510" fill="#73726c" font-size="12">on pass, orchestrator</text>
<path d="M180 524 L456 524 L480 548 L480 572 L180 572 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><path d="M456 524 L456 548 L480 548" fill="none" stroke="#854F0B" stroke-width="0.5"/>
<text x="330" y="542" text-anchor="middle" dominant-baseline="central" fill="#633806" font-size="14" font-weight="500">code + docs committed, PR opened</text><text x="330" y="559" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-size="12">docs only; reports stay local; human merges</text>
</svg>
