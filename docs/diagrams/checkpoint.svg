<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 560" role="img" font-family="sans-serif">
<title>The checkpoint cycle, shared by both modes</title>
<desc>After every PR, and on entry and on reclaim, the loop renders a board that sorts each deliverable by state into READY, AWAITING MERGE, BLOCKED and POSSIBLY STALLED with the critical path starred, then a fixed decision widget showing only the applicable verbs with Wait always. Every non-wait choice acts, reconciles and returns to the board. The only mode difference is when Carry on and Build a specific one appear.</desc>
<defs><marker id="cka" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="40" y="28" fill="#444441" font-size="13" font-weight="500">The checkpoint: one board, one fixed widget, the same in both modes</text>

<!-- board node -->
<rect x="40" y="46" width="600" height="150" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="58" y="68" fill="#5F5E5A" font-size="12" font-weight="600">THE BOARD (rendered verbatim from the on-disk template)</text>
<text x="58" y="90" fill="#5F5E5A" font-size="11">this queue: M of T merged to main.</text>
<rect x="58" y="100" width="180" height="22" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="68" y="115" fill="#854F0B" font-size="10.5">POSSIBLY STALLED  (your call)</text>
<rect x="248" y="100" width="180" height="22" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="258" y="115" fill="#854F0B" font-size="10.5">AWAITING MERGE  (you merge)</text>
<rect x="438" y="100" width="140" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="448" y="115" fill="#185FA5" font-size="10.5">READY  (build next)</text>
<rect x="58" y="128" width="180" height="22" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="68" y="143" fill="#5F5E5A" font-size="10.5">BLOCKED  (deps unmerged)</text>
<text x="58" y="172" fill="#5F5E5A" font-size="10.5">Legend.  &#9733; = on a longest dependency chain through the sheet, the longest path to done.</text>
<text x="58" y="187" fill="#5F5E5A" font-size="10.5">Starred rows appear in every section so the whole critical path stays visible.</text>

<!-- arrow board -> widget -->
<line x1="340" y1="196" x2="340" y2="224" stroke="#444441" stroke-width="1.5" marker-end="url(#cka)"/>

<!-- decision node -->
<rect x="150" y="226" width="380" height="120" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<text x="170" y="248" fill="#854F0B" font-size="12" font-weight="600">ask_user_input  (single-select, fixed labels, never reworded)</text>
<text x="170" y="266" fill="#854F0B" font-size="10">only the applicable verbs are shown; Wait is always shown</text>
<!-- chips -->
<rect x="170" y="278" width="86" height="24" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="213" y="294" fill="#185FA5" font-size="10" text-anchor="middle">Carry on</text>
<rect x="264" y="278" width="132" height="24" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="330" y="294" fill="#185FA5" font-size="10" text-anchor="middle">Build a specific one</text>
<rect x="404" y="278" width="106" height="24" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text x="457" y="294" fill="#854F0B" font-size="10" text-anchor="middle">Merge the PR</text>
<rect x="170" y="310" width="150" height="24" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text x="245" y="326" fill="#854F0B" font-size="10" text-anchor="middle">Resume the stalled one</text>
<rect x="328" y="310" width="70" height="24" rx="12" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="363" y="326" fill="#5F5E5A" font-size="10" text-anchor="middle">Wait</text>

<!-- outcomes -->
<line x1="240" y1="346" x2="200" y2="392" stroke="#444441" stroke-width="1.5" marker-end="url(#cka)"/>
<line x1="457" y1="346" x2="470" y2="392" stroke="#444441" stroke-width="1.5" marker-end="url(#cka)"/>
<line x1="363" y1="346" x2="363" y2="392" stroke="#444441" stroke-width="1.5" marker-end="url(#cka)"/>

<rect x="70" y="394" width="260" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="200" y="412" fill="#185FA5" font-size="10.5" text-anchor="middle" font-weight="600">build one deliverable</text>
<text x="200" y="427" fill="#185FA5" font-size="9.5" text-anchor="middle">branch, builder, reviewer, judge, document, open PR</text>

<rect x="346" y="394" width="34" height="44" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="363" y="420" fill="#5F5E5A" font-size="10" text-anchor="middle">stop</text>

<rect x="396" y="394" width="200" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<text x="496" y="412" fill="#854F0B" font-size="10.5" text-anchor="middle" font-weight="600">human merges the PR</text>
<text x="496" y="427" fill="#854F0B" font-size="9.5" text-anchor="middle">loop reconciles, frees dependents</text>

<!-- loop-backs to board -->
<path d="M70 416 C24 416, 24 121, 38 121" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cka)"/>
<path d="M596 416 C656 416, 656 121, 642 121" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cka)"/>
<text x="20" y="470" fill="#5F5E5A" font-size="10">every non-wait choice acts, reconciles, then returns to the board: the loop stops after every PR</text>

<!-- mode-difference side note -->
<rect x="40" y="486" width="600" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 2"/>
<text x="52" y="501" fill="#5F5E5A" font-size="10.5" font-weight="600">The only mode difference:</text>
<text x="186" y="501" fill="#5F5E5A" font-size="10.5">Carry on and Build a specific one show whenever READY is non-empty in</text>
<text x="52" y="515" fill="#5F5E5A" font-size="10.5">parallel-attended, but only when nothing else is in flight in sequential-attended.</text>

<!-- caption -->
<text x="40" y="540" fill="#5F5E5A" font-size="11">If subagent dispatch is unavailable the loop degrades to one build per conversation; the fixed labels never reword between renders.</text>
</svg>
